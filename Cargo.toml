[package]
name = "gitspace"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
# MSRV-aware resolution: `cargo update` never locks a crate newer than rust-version allows.
resolver = "3"
description = "Desktop Git client that gathers your GitHub and GitLab repositories in one panel-based interface"
license = "GPL-3.0-or-later"
repository = "https://github.com/Project-Colony/GitSpace"

[features]
default = []
dev-tools = ["mock-providers", "fake-repos"]
fake-repos = []
mock-providers = []

[dependencies]
eframe = "0.27.2"
egui = "0.33.3"
git2 = { version = "0.21.0", features = ["https", "ssh", "vendored-openssl"] }
poll-promise = "0.3.0"
reqwest = { version = "0.13.5", features = ["blocking", "form", "json", "query"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dirs = "7.0.0"
open = "5.4.4"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# `v1` picks the platform store at compile time: Keychain on macOS, Credential
# Manager on Windows, Secret Service (pure Rust crypto) elsewhere. There is no
# silent in-memory fallback: an unavailable store is an error.
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
chacha20poly1305 = "0.11.0"
rand = "0.10.3"
base64 = "0.23.1"
url = "2.5.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["ansi", "env-filter", "fmt", "json", "registry"] }
tracing-appender = "0.2.5"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["derive"] }
parking_lot = "0.12.5"
oauth2 = { version = "5.0.0", default-features = false }
webbrowser = "1.2.4"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
