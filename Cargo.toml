[package]
name = "GitSpace"
version = "0.1.0"
edition = "2021"
description = "Desktop Git client that gathers your GitHub and GitLab repositories in one panel-based interface"
license = "GPL-3.0-or-later"
repository = "https://github.com/Project-Colony/GitSpace"

[features]
default = []
dev-tools = ["mock-providers", "fake-repos"]
fake-repos = []
mock-providers = []

[dependencies]
eframe = { version = "0.27", features = ["wgpu"] }
egui = "0.27"
git2 = "0.18"
poll-promise = "0.3"
reqwest = { version = "0.12", features = ["blocking", "json"] }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
open = "5.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
keyring = "2.3"
chacha20poly1305 = { version = "0.10", features = ["std"] }
rand = "0.8"
base64 = "0.22"
hostname = "0.3"
url = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["ansi", "env-filter", "fmt", "json", "registry"] }
tracing-appender = "0.2"
argon2 = { version = "0.5", default-features = false, features = ["std"] }
hmac = "0.12"
thiserror = "1.0"
zeroize = { version = "1.7", features = ["derive"] }
parking_lot = "0.12"
oauth2 = { version = "5", default-features = false, features = ["reqwest-blocking"] }
tiny_http = "0.12"
webbrowser = "1.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
